<!DOCTYPE html>
<html>
<head>
    <title>Sarranya's Website - Login</title>

    <style>
        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        .login-box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            color: #7c3aed;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Hello! This is Sarranya.</h1>

        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username" required>
            <br>

            <input type="password" placeholder="Password" required>
            <br>

            <button type="submit">Login</button>
        </form>

    </div>

</body>
</html>
