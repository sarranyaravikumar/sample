<!DOCTYPE html>
<html>
<head>
    <title>Sarranya's Website</title>

    <style>
        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .search-box {
            background-color: white;
            width: 550px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }

        input[type="text"] {
            width: 80%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="search-box">

        <h1>Hello! This is Sarranya.</h1>

        <p>Enter your message below:</p>

        <form action="YOUR_FORMSPREE_ENDPOINT" method="POST">

            <input
                type="text"
                name="message"
                placeholder="Type something..."
                required
            >

            <br>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
